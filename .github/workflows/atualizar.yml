name: Atualizar Playlist Diariamente

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v3

    - name: Configurar o Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Instalar dependências de rede
      run: pip install requests

    - name: Executar script gerador
      run: python atualizar_playlist.py

    - name: Salvar alterações de volta no GitHub
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add playlist.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática da playlist" && git push)
